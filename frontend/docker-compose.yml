services:
  lumendesk-python:
    build:
      context: ../echomind
      dockerfile: Dockerfile
      target: production
    container_name: lumendesk-python
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../echomind/.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lumendesk123}
      REDIS_URL: redis://:${REDIS_PASSWORD:-lumendesk123}@redis:6379/0
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      LUMENDESK_SKILLS_DIR: /app/skills
    volumes:
      - lumendesk-python-data:/app/data
      - ../echomind/skills:/app/skills
      - ../echomind/config/mcp_servers.json:/app/config/mcp_servers.json:ro
    depends_on:
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks:
      - lumendesk-network

  redis:
    image: redis:7-alpine
    container_name: lumendesk-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lumendesk123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - lumendesk-network

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: lumendesk-chromadb
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - lumendesk-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumendesk-frontend
    environment:
      PYTHON_API_URL: /api/python
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      lumendesk-python:
        condition: service_started
    restart: unless-stopped
    networks:
      - lumendesk-network

  nginx:
    image: nginx:1.27-alpine
    container_name: lumendesk-gateway
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      lumendesk-python:
        condition: service_started
    restart: unless-stopped
    networks:
      - lumendesk-network

networks:
  lumendesk-network:
    driver: bridge

volumes:
  redis-data:
  chromadb-data:
  lumendesk-python-data:
