# 本文件用于单独启动前端；完整生产栈请从项目根目录运行 docker compose。
# 启动前请确保 LumenDesk 后端已监听宿主机 8000 端口。
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumendesk-frontend
    environment:
      PYTHON_API_URL: ${PYTHON_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    restart: unless-stopped
